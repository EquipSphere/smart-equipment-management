server.port=8080
spring.application.name=smart-equipment-backend

# Neon Cloud PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://ep-green-unit-az5numnl.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_KeHX82rjCkxO
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations (Direct live sync with Neon DB tables)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# HikariCP Connection Pool Settings (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Date Time format in JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo

