# ==========================================================
# Smart Equipment Booking & Maintenance System
# Spring Boot Configuration
# ==========================================================

server.port=8080
spring.application.name=smart-equipment-backend

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_equipment_db
spring.datasource.username=postgres
spring.datasource.password=Sh1234@@
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Date Time format in JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo
